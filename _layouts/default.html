<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
  {% seo %}
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="site-title" href="{{ '/' | relative_url }}"><span class="prompt">&gt;_</span> {{ site.title }}<span class="cursor">&#9612;</span></a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">./posts</a>
        <a href="{{ '/about/' | relative_url }}">./about</a>
        <a href="{{ '/feed.xml' | relative_url }}">./rss</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer">
    <div class="wrap">
      <p><span class="status-dot"></span>online · &copy; {{ site.time | date: '%Y' }} {{ site.author.name }} · jekyll/pages</p>
    </div>
  </footer>
</body>
</html>
